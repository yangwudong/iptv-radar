[pytest]
testpaths = tests
addopts = -q --strict-markers
# (需要 pytest-timeout 才能用 timeout=,当前不装以免多一个依赖;
#  CI 里已用 timeout-minutes 兜住)
# 把 DeprecationWarning 当错误: 静默的弃用警告就是下次 Python/依赖升级时的雷
filterwarnings =
    error::DeprecationWarning
    default
# 注: 没把 ResourceWarning 设为 error —— 测试里有若干未关句柄(卫生问题,非产品缺陷),
#     把它当错误会让真正的回归信号被噪音淹没。要清理的话单独做。
