name: Build and Push Docker Image

# 触发: push到main 或 打版本tag(v*) 时构建镜像推 Docker Hub。
# 注意: 本Actions只构建镜像,不运行扫描(GitHub云端访问不了家庭组播专网)。
#       实际扫描由 NAS 上 cron 触发 docker compose run(见 docs/DEPLOY.md)。

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:                     # 只在影响镜像的文件变动时构建(省额度)
      - 'src/**'
      - 'reference/**'
      - 'Dockerfile'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/workflows/docker-build.yml'
  pull_request:                # PR 只跑测试,不推镜像
    branches: [main]
  workflow_dispatch:           # 支持手动触发

env:
  IMAGE_NAME: iptv-radar       # Docker Hub 仓库名: <用户名>/iptv-radar

jobs:
  # 先跑测试: 数据正确性回归(串台/下线判定/归并快照/m3u生成等)。
  # 这些 bug 曾经全靠人工发现,现在必须在推镜像之前挡住。
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run tests
        run: python -m pytest tests/ -v

  build-and-push:
    needs: test                # 测试不过不推镜像
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
